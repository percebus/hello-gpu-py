[tool.poetry]
name = "hello-gpu-py"
version = "0.1.0"
description = "GPU python excercises"
authors = ["JC Guerrero <JCystems@gMail.com>"]
license = "SEE LICENSE IN LICENSE.md"
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.12"

# FIXME ~12.6.2 fails
# "Unable to find installation candidates for cuda-python (12.6.2)"
cuda-python = "12.6.1"

numpy = "^2.1.3"
torch = {version = "^2.5.1+cu124", source = "pytorch-gpu"}
torchaudio = {version = "^2.5.1+cu124", source = "pytorch-gpu"}
torchvision = {version = "^0.20.1+cu124", source = "pytorch-gpu"}

[tool.poetry.group.dev.dependencies]
pyhamcrest = "^2.1.0"
pypyr = "^5.9.1"
pytest = "^8.3.3"
pytest-dotenv = "^0.5.2"
ruff = "^0.7.2"


[[tool.poetry.source]]
name = "pytorch-gpu"
url = "https://download.pytorch.org/whl/cu124"
priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
